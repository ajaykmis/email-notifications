apiVersion: v1
kind: Secret
metadata:
  name: email-marketing-secrets
  namespace: email-marketing
  labels:
    app: email-marketing
  annotations:
    # Replace these placeholder values with real secrets from GCP Secret Manager.
    # Example using External Secrets Operator or manual kubectl create secret:
    #   kubectl create secret generic email-marketing-secrets \
    #     --from-literal=RESEND_API_KEY=re_xxxx \
    #     --from-literal=RESEND_WEBHOOK_SECRET=whsec_xxxx \
    #     -n email-marketing
    note: "Replace placeholder values from GCP Secret Manager before deploying"
type: Opaque
stringData:
  RESEND_API_KEY: "REPLACE_FROM_GCP_SECRET_MANAGER"
  RESEND_WEBHOOK_SECRET: "REPLACE_FROM_GCP_SECRET_MANAGER"

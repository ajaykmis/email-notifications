apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: email-marketing
  labels:
    app: email-marketing
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-marketing
      component: prometheus
  template:
    metadata:
      labels:
        app: email-marketing
        component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: email-marketing
  labels:
    app: email-marketing
    component: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: email-marketing
    component: prometheus

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: email-marketing
  labels:
    app: email-marketing
    component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "redis-exporter"
        static_configs:
          - targets: ["redis-exporter:9121"]

      - job_name: "api"
        static_configs:
          - targets: ["api:9091"]

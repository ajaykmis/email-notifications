apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: email-marketing
  labels:
    app: email-marketing
    component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-marketing
      component: webhook
  template:
    metadata:
      labels:
        app: email-marketing
        component: webhook
    spec:
      containers:
        - name: webhook
          image: gcr.io/PROJECT_ID/email-notifications-webhook:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: email-marketing-config
            - secretRef:
                name: email-marketing-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: email-marketing
  labels:
    app: email-marketing
    component: webhook
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: email-marketing
    component: webhook
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhook-hpa
  namespace: email-marketing
  labels:
    app: email-marketing
    component: webhook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webhook
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

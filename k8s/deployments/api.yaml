apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: email-marketing
  labels:
    app: email-marketing
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-marketing
      component: api
  template:
    metadata:
      labels:
        app: email-marketing
        component: api
    spec:
      containers:
        - name: api
          image: gcr.io/PROJECT_ID/email-notifications-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: email-marketing-config
            - secretRef:
                name: email-marketing-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: email-marketing
  labels:
    app: email-marketing
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: email-marketing
    component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: email-marketing
  labels:
    app: email-marketing
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emaildb
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/uploads   # shared with campaign worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Transactional worker — high priority, dedicated process
  worker-transactional:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-mock}
      DRY_RUN: ${DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Campaign worker — streams file line-by-line, fans out to queue:promotional
  worker-campaign:
    build:
      context: .
      dockerfile: Dockerfile.campaign
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/uploads   # reads the same file the marketing service dropped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Promotional worker — scaled separately, won't starve transactional
  worker-promotional:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-mock}
      DRY_RUN: ${DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    ports:
      - "8084:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/emaildb?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - webhook

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_KEYS: queue:transactional,queue:promotional,queue:campaigns,queue:analytics
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  pgdata:
  uploads:   # shared volume: marketing service writes, campaign worker reads
